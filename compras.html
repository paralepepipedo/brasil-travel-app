<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#009b3a">
  <title>Compras - Brasil Travel App</title>

  <!-- CSS externos (igual que itinerario) -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Sincronización con Supabase -->
  <script src="supabase-sync.js"></script>

  <style>
    /* Estilos específicos de compras */
    .sync-status {
      font-size: 0.85rem;
      color: #666;
      padding: 0.4rem 0.8rem;
      background: #e3f2fd;
      border-radius: 6px;
    }

    .sync-status.syncing {
      background: #fff3e0;
      color: #e65100;
    }

    .sync-status.online {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .sync-status.offline {
      background: #ffebee;
      color: #c62828;
    }

    .compras-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .compras-header h2 {
      color: #1b5e20;
      font-size: 1.5rem;
      margin: 0;
    }

    .form-section {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .form-section h3 {
      color: #1b5e20;
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }

    .form-grid {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .form-grid-2 {
      grid-template-columns: 1fr 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group-full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      color: #01579b;
      font-size: 0.85rem;
    }

    input,
    select,
    textarea {
      padding: 0.65rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      background: white;
      transition: border-color 0.3s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #1b5e20;
      box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.1);
    }

    .btn {
      padding: 0.65rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }

    .btn-primary {
      background: #1b5e20;
      color: white;
    }

    .btn-primary:hover {
      background: #2e7d32;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(27, 94, 32, 0.3);
    }

    .btn-secondary {
      background: #01579b;
      color: white;
    }

    .btn-secondary:hover {
      background: #0277bd;
    }

    .btn-danger {
      background: #d32f2f;
      color: white;
    }

    .btn-danger:hover {
      background: #b71c1c;
      transform: scale(1.05);
    }

    .btn-mini {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    .btn-icon {
      padding: 0.5rem;
      min-width: 40px;
    }

    .filtros-compras {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: #e3f2fd;
      border-radius: 8px;
    }

    .filtros-compras label {
      font-size: 0.85rem;
    }

    .contador-compras {
      text-align: center;
      color: #666;
      margin: 1rem 0;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .compra-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto auto;
      align-items: start;
      gap: 0.75rem;
      padding: 0.75rem;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      transition: all 0.2s;
    }

    .compra-item:hover {
      background: #f0f7f0;
      border-color: #1b5e20;
      transform: translateX(3px);
    }

    .compra-item.comprado {
      background: #e8f5e9;
      opacity: 0.85;
    }

    .compra-item.comprado .compra-nombre {
      text-decoration: line-through;
      color: #666;
    }

    .compra-chk {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #1b5e20;
      margin-top: 2px;
    }

    .compra-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .compra-nombre {
      font-weight: 600;
      color: #1b5e20;
      font-size: 1rem;
    }

    .compra-meta {
      font-size: 0.8rem;
      color: #666;
    }

    .compra-precio {
      font-weight: 700;
      color: #1b5e20;
      font-size: 1rem;
      text-align: right;
      white-space: nowrap;
    }

    .compra-precio-clp {
      font-size: 0.75rem;
      color: #666;
      font-weight: 500;
    }

    .compra-actions {
      grid-column: 2 / -1;
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .resumen-totales {
      position: sticky;
      bottom: 10px;
      background: #1b5e20;
      color: white;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .resumen-block {
      text-align: center;
    }

    .resumen-label {
      font-size: 0.7rem;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
    }

    .resumen-val {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .resumen-val-secondary {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-top: 0.25rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: #666;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
      line-height: 1;
    }

    .modal-close:hover {
      background: #f5f5f5;
      color: #d32f2f;
    }

    .modal h2 {
      color: #1b5e20;
      margin-bottom: 1rem;
    }

    .modal h3 {
      color: #01579b;
      margin: 1.5rem 0 0.75rem 0;
      font-size: 1.1rem;
    }

    .categoria-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f5f5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }

    .categoria-nombre {
      font-weight: 500;
      color: #333;
      font-size: 0.95rem;
      flex: 1;
    }

    .categoria-edit-input {
      display: none;
      flex: 1;
      padding: 0.5rem;
      border: 2px solid #1b5e20;
      border-radius: 6px;
    }

    .categoria-edit-input.active {
      display: block;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .no-compras {
      text-align: center;
      color: #666;
      padding: 2rem 1rem;
      font-style: italic;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #666;
    }

    /* RESPONSIVE MÓVIL */
    @media (max-width: 768px) {
      .compras-header h2 {
        font-size: 1.3rem;
      }

      .form-section {
        padding: 0.75rem;
      }

      .form-section h3 {
        font-size: 1.1rem;
      }

      .form-grid-2 {
        grid-template-columns: 1fr;
      }

      .filtros-compras {
        grid-template-columns: 1fr;
        padding: 0.75rem;
        gap: 0.5rem;
      }

      .compra-item {
        padding: 0.65rem;
        gap: 0.5rem;
      }

      .btn-mini {
        padding: 0.35rem 0.6rem;
        font-size: 0.75rem;
      }

      /* RESUMEN COMPACTO EN MÓVIL */
      .resumen-totales {
        grid-template-columns: repeat(3, 1fr);
        padding: 0.5rem;
        gap: 0.4rem;
        bottom: 0;
        border-radius: 12px 12px 0 0;
      }

      .resumen-block {
        padding: 0.25rem 0;
      }

      .resumen-label {
        font-size: 0.6rem;
        margin-bottom: 0.15rem;
        letter-spacing: 0;
      }

      .resumen-val {
        font-size: 0.85rem;
        line-height: 1.1;
      }

      .resumen-val-secondary {
        font-size: 0.65rem;
        margin-top: 0.1rem;
        line-height: 1;
      }

      .modal-content {
        padding: 1rem;
      }

      .categoria-item {
        padding: 0.6rem 0.75rem;
        flex-wrap: wrap;
      }

      .btn-group {
        width: 100%;
      }

      .btn-group .btn {
        flex: 1;
        min-width: 0;
        font-size: 0.8rem;
        padding: 0.5rem 0.75rem;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER CON NAVEGACIÓN (igual que itinerario.html) -->
  <header class="app-header">
    <h1 class="app-title"><span>🇧🇷</span> Brasil Travel App</h1>
    <nav class="nav-tabs">
      <button class="nav-tab" onclick="window.location.href='index.html#dashboard'">📊 Resumen</button>
      <button class="nav-tab" onclick="window.location.href='index.html#gastos'">💰 Gastos</button>
      <button class="nav-tab" onclick="window.location.href='index.html#alojamiento'">🏨 Alojamiento</button>
      <button class="nav-tab active" onclick="window.location.href='compras.html'">🛒 Compras</button>
      <button class="nav-tab" onclick="window.location.href='index.html#atracciones'">🎭 Atracciones</button>
      <button class="nav-tab" onclick="window.location.href='itinerario.html'">📅 Itinerario</button>
      <button class="nav-tab" onclick="window.location.href='index.html#vuelos'">✈️ Vuelos</button>
      <button class="nav-tab" onclick="window.location.href='index.html#documentos'">📄 Documentos</button>
      <button class="nav-tab" onclick="window.location.href='index.html#configuracion'">⚙️ Configuración</button>
    </nav>
    <button class="menu-toggle" id="menuToggle">☰</button>
  </header>

  <!-- MENÚ MÓVIL -->
  <div class="mobile-menu" id="mobileMenu">
    <button onclick="window.location.href='index.html#dashboard'">📊 Resumen</button>
    <button onclick="window.location.href='index.html#gastos'">💰 Gastos</button>
    <button onclick="window.location.href='index.html#alojamiento'">🏨 Alojamiento</button>
    <button class="active">🛒 Compras</button>
    <button onclick="window.location.href='index.html#atracciones'">🎭 Atracciones</button>
    <button onclick="window.location.href='itinerario.html'">📅 Itinerario</button>
    <button onclick="window.location.href='index.html#vuelos'">✈️ Vuelos</button>
    <button onclick="window.location.href='index.html#documentos'">📄 Documentos</button>
    <button onclick="window.location.href='index.html#configuracion'">⚙️ Configuración</button>
  </div>

  <div class="container">
    <div class="compras-header">
      <h2>📋 Lista de Compras</h2>
      <div class="sync-status" id="syncStatus">
        <span id="syncText">Conectando...</span>
      </div>
    </div>

    <div class="form-section">
      <h3 id="formTitulo">Agregar Compra</h3>
      <form id="formCompra">
        <div class="form-grid form-grid-2">
          <div class="form-group form-group-full">
            <label for="compraArticulo">Artículo *</label>
            <input type="text" id="compraArticulo" placeholder="Ej: Protector solar" required>
          </div>

          <div class="form-group">
            <label for="compraCantidad">Cantidad</label>
            <input type="number" id="compraCantidad" min="1" value="1">
          </div>

          <div class="form-group">
            <label for="compraPrecio">Precio (BRL)</label>
            <input type="number" id="compraPrecio" min="0" step="0.01" placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="compraCategoria">Categoría *</label>
            <div style="display: flex; gap: 0.5rem;">
              <select id="compraCategoria" style="flex: 1;" required>
                <option value="">Cargando...</option>
              </select>
              <button type="button" class="btn btn-secondary btn-icon" onclick="abrirModalCategorias()"
                title="Gestionar Categorías">⚙️</button>
            </div>
          </div>

          <div class="form-group">
            <label for="compraNotas">Notas</label>
            <input type="text" id="compraNotas" placeholder="Observaciones...">
          </div>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-primary" id="btnSubmitCompra" style="flex: 2;">➕ Agregar</button>
          <button type="button" class="btn btn-secondary" id="btnCancelarEdit" onclick="cancelarEdicion()"
            style="display: none; flex: 1;">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="filtros-compras">
      <label for="filtroEstado">Estado:</label>
      <select id="filtroEstado" onchange="aplicarFiltros()">
        <option value="todos">Ver Todos</option>
        <option value="pendientes">Pendientes</option>
        <option value="comprados">Comprados</option>
      </select>

      <label for="filtroCategoria">Categoría:</label>
      <select id="filtroCategoria" onchange="aplicarFiltros()">
        <option value="todas">Todas las categorías</option>
      </select>
    </div>

    <div class="contador-compras" id="contadorCompras">
      Cargando...
    </div>

    <div id="listaCompras">
      <div class="loading">🔄 Cargando compras...</div>
    </div>

    <div class="resumen-totales">
      <div class="resumen-block">
        <div class="resumen-label">Total Todas</div>
        <div class="resumen-val" id="totalTodas">R$ 0,00</div>
        <div class="resumen-val-secondary" id="totalTodasCLP">$0 CLP</div>
      </div>
      <div class="resumen-block">
        <div class="resumen-label">Compradas</div>
        <div class="resumen-val" id="totalCompradas">R$ 0,00</div>
        <div class="resumen-val-secondary" id="totalCompradasCLP">$0 CLP</div>
      </div>
      <div class="resumen-block">
        <div class="resumen-label">Pendientes</div>
        <div class="resumen-val" id="totalPendientes">R$ 0,00</div>
        <div class="resumen-val-secondary" id="totalPendientesCLP">$0 CLP</div>
      </div>
    </div>
  </div>

  <!-- MODAL CATEGORÍAS -->
  <div class="modal" id="modalCategorias">
    <div class="modal-content">
      <button class="modal-close" onclick="cerrarModal('modalCategorias')">&times;</button>
      <h2>Gestionar Categorías</h2>

      <div style="margin-bottom: 1.5rem;">
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="nuevaCategoriaInput" placeholder="Nueva categoría..."
            onkeypress="if(event.key === 'Enter') { agregarCategoria(); event.preventDefault(); }">
          <button class="btn btn-primary" onclick="agregarCategoria()">➕</button>
        </div>
      </div>

      <h3>Categorías existentes:</h3>
      <div id="listaCategoriasAdmin">
        <div class="loading">Cargando categorías...</div>
      </div>

      <div style="margin-top: 1.5rem; text-align: center;">
        <button class="btn btn-secondary" onclick="cerrarModal('modalCategorias')">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'brasilTravelApp';

    let idCompraEdicion = null;
    let categorias = [];
    let compras = [];
    let tasaCambio = 150;
    let isOnline = navigator.onLine;

    window.addEventListener('load', async function () {
      console.log('🚀 Iniciando compras...');

      window.addEventListener('online', () => {
        isOnline = true;
        updateSyncStatus('online', '✅ En línea');
        cargarDatos();
      });

      window.addEventListener('offline', () => {
        isOnline = false;
        updateSyncStatus('offline', '🔴 Sin conexión');
      });

      if (window.SupabaseSync) {
        await SupabaseSync.init();
        console.log('✅ SupabaseSync inicializado');
      }

      await cargarDatos();
    });

    async function cargarDatos() {
      console.log('📥 Cargando datos...');
      updateSyncStatus('syncing', '🔄 Sincronizando...');

      try {
        if (window.SupabaseSync && isOnline) {
          await SupabaseSync.sync();
        }

        const dataStr = localStorage.getItem(STORAGE_KEY);
        if (dataStr) {
          const data = JSON.parse(dataStr);

          compras = data.compras || [];
          tasaCambio = data.tasaCambio || data.configuracion?.tasaCambio || 150;

          console.log(`✅ ${compras.length} compras desde localStorage`);
        }

        const categoriasStr = localStorage.getItem('categorias_compras');
        if (categoriasStr) {
          categorias = JSON.parse(categoriasStr);
        } else {
          categorias = ['Bebidas', 'Comida/Snacks', 'Playa', 'Higiene', 'Medicamentos', 'Otros'];
          localStorage.setItem('categorias_compras', JSON.stringify(categorias));
        }

        console.log(`✅ ${categorias.length} categorías`);

        renderizarOpcionesCategorias();
        renderizarFiltrosCategorias();
        renderizarCompras();

        updateSyncStatus('online', '✅ Sincronizado');
        setTimeout(() => updateSyncStatus('online', ''), 3000);

      } catch (error) {
        console.error('Error:', error);
        updateSyncStatus('offline', '⚠️ Modo offline');

        const dataStr = localStorage.getItem(STORAGE_KEY);
        if (dataStr) {
          const data = JSON.parse(dataStr);
          compras = data.compras || [];
          tasaCambio = data.tasaCambio || 150;
        }

        const categoriasStr = localStorage.getItem('categorias_compras');
        if (categoriasStr) {
          categorias = JSON.parse(categoriasStr);
        }

        renderizarOpcionesCategorias();
        renderizarFiltrosCategorias();
        renderizarCompras();
      }
    }

    function updateSyncStatus(status, text) {
      const statusEl = document.getElementById('syncStatus');
      const textEl = document.getElementById('syncText');

      if (statusEl) statusEl.className = 'sync-status ' + status;
      if (textEl) textEl.textContent = text;
    }

    function renderizarOpcionesCategorias() {
      const select = document.getElementById('compraCategoria');
      if (!select) return;

      const valorActual = select.value;
      select.innerHTML = '';

      categorias.forEach(c => {
        const op = document.createElement('option');
        op.value = c;
        op.textContent = c;
        select.appendChild(op);
      });

      if (categorias.includes(valorActual)) {
        select.value = valorActual;
      }
    }

    function renderizarFiltrosCategorias() {
      const select = document.getElementById('filtroCategoria');
      if (!select) return;

      const valorActual = select.value;
      select.innerHTML = '<option value="todas">Todas las categorías</option>';

      categorias.forEach(c => {
        const op = document.createElement('option');
        op.value = c;
        op.textContent = c;
        select.appendChild(op);
      });

      if (categorias.includes(valorActual)) {
        select.value = valorActual;
      }
    }

    function renderizarCompras() {
      const lista = document.getElementById('listaCompras');
      if (!lista) return;

      lista.innerHTML = '';

      let comprasFiltradas = [...compras];

      const estado = document.getElementById('filtroEstado')?.value || 'todos';
      const categoria = document.getElementById('filtroCategoria')?.value || 'todas';

      if (estado === 'pendientes') {
        comprasFiltradas = comprasFiltradas.filter(c => !c.comprado);
      } else if (estado === 'comprados') {
        comprasFiltradas = comprasFiltradas.filter(c => c.comprado);
      }

      if (categoria !== 'todas') {
        comprasFiltradas = comprasFiltradas.filter(c => c.categoria === categoria);
      }

      let totalTodasBRL = 0;
      let totalCompradasBRL = 0;
      let totalPendientesBRL = 0;

      compras.forEach(c => {
        const precio = parseFloat(c.precio) || 0;
        totalTodasBRL += precio;

        if (c.comprado) {
          totalCompradasBRL += precio;
        } else {
          totalPendientesBRL += precio;
        }
      });

      if (comprasFiltradas.length === 0) {
        lista.innerHTML = '<p class="no-compras">No hay compras con este filtro</p>';
      } else {
        comprasFiltradas.forEach(compra => {
          const precio = parseFloat(compra.precio) || 0;
          const clp = Math.round(precio * tasaCambio).toLocaleString('es-CL');

          const div = document.createElement('div');
          div.className = 'compra-item' + (compra.comprado ? ' comprado' : '');

          div.innerHTML = `
            <input type="checkbox" class="compra-chk" ${compra.comprado ? 'checked' : ''} 
                   onchange="toggleComprado('${compra.id}')">

            <div class="compra-info">
              <div class="compra-nombre">${escapeHtml(compra.articulo)}</div>
              <div class="compra-meta">
                ${escapeHtml(compra.categoria)} • Cant: ${compra.cantidad}
                ${compra.notas ? ' • ' + escapeHtml(compra.notas) : ''}
              </div>
            </div>

            <div class="compra-precio">
              R$ ${precio.toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
              <div class="compra-precio-clp">$${clp}</div>
            </div>

            <div class="compra-actions">
              <button class="btn btn-secondary btn-mini" onclick="editarCompra('${compra.id}')" title="Editar">✏️</button>
              <button class="btn btn-danger btn-mini" onclick="eliminarCompra('${compra.id}')" title="Eliminar">🗑️</button>
            </div>
          `;

          lista.appendChild(div);
        });
      }

      const numPendientes = compras.filter(c => !c.comprado).length;
      const numComprados = compras.filter(c => c.comprado).length;
      document.getElementById('contadorCompras').textContent =
        `${numPendientes} pendiente${numPendientes !== 1 ? 's' : ''}, ${numComprados} comprado${numComprados !== 1 ? 's' : ''}`;

      const fmt = v => 'R$ ' + v.toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const fmtClp = v => '$' + Math.round(v).toLocaleString('es-CL') + ' CLP';

      document.getElementById('totalTodas').textContent = fmt(totalTodasBRL);
      document.getElementById('totalTodasCLP').textContent = fmtClp(totalTodasBRL * tasaCambio);

      document.getElementById('totalCompradas').textContent = fmt(totalCompradasBRL);
      document.getElementById('totalCompradasCLP').textContent = fmtClp(totalCompradasBRL * tasaCambio);

      document.getElementById('totalPendientes').textContent = fmt(totalPendientesBRL);
      document.getElementById('totalPendientesCLP').textContent = fmtClp(totalPendientesBRL * tasaCambio);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function toggleComprado(id) {
      const compra = compras.find(c => c.id === id);
      if (!compra) return;

      compra.comprado = !compra.comprado;

      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      data.compras = compras;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      if (window.SupabaseSync && isOnline) {
        try {
          await SupabaseSync.uploadSingle('compra', compra);
        } catch (e) {
          console.error('Error al sincronizar:', e);
        }
      }

      renderizarCompras();
    }

    async function editarCompra(id) {
      const compra = compras.find(c => c.id === id);
      if (!compra) return;

      idCompraEdicion = id;
      document.getElementById('compraArticulo').value = compra.articulo;
      document.getElementById('compraCantidad').value = compra.cantidad;
      document.getElementById('compraCategoria').value = compra.categoria;
      document.getElementById('compraNotas').value = compra.notas || '';
      document.getElementById('compraPrecio').value = compra.precio || '';

      document.getElementById('btnSubmitCompra').textContent = '💾 Actualizar';
      document.getElementById('btnSubmitCompra').className = 'btn btn-secondary';
      document.getElementById('btnCancelarEdit').style.display = 'block';
      document.getElementById('formTitulo').textContent = 'Editar Compra';

      document.getElementById('formCompra').scrollIntoView({ behavior: 'smooth' });
      setTimeout(() => document.getElementById('compraArticulo').focus(), 300);
    }

    function cancelarEdicion() {
      idCompraEdicion = null;
      document.getElementById('formCompra').reset();
      document.getElementById('compraCantidad').value = 1;

      document.getElementById('btnSubmitCompra').textContent = '➕ Agregar';
      document.getElementById('btnSubmitCompra').className = 'btn btn-primary';
      document.getElementById('btnCancelarEdit').style.display = 'none';
      document.getElementById('formTitulo').textContent = 'Agregar Compra';
    }

    async function eliminarCompra(id) {
      if (!confirm('¿Eliminar?')) return;

      compras = compras.filter(c => c.id !== id);

      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      data.compras = compras;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      if (window.SupabaseSync && isOnline) {
        try {
          await SupabaseSync.sync();
        } catch (e) {
          console.error('Error al sincronizar:', e);
        }
      }

      renderizarCompras();
    }

    document.getElementById('formCompra').addEventListener('submit', async function (e) {
      e.preventDefault();

      const compraData = {
        id: idCompraEdicion || Date.now().toString(),
        articulo: document.getElementById('compraArticulo').value.trim(),
        cantidad: parseInt(document.getElementById('compraCantidad').value) || 1,
        precio: parseFloat(document.getElementById('compraPrecio').value) || 0,
        categoria: document.getElementById('compraCategoria').value,
        notas: document.getElementById('compraNotas').value.trim(),
        comprado: false
      };

      if (idCompraEdicion) {
        const index = compras.findIndex(c => c.id === idCompraEdicion);
        if (index !== -1) {
          compraData.comprado = compras[index].comprado;
          compras[index] = compraData;
        }
      } else {
        compras.push(compraData);
      }

      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      data.compras = compras;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      if (window.SupabaseSync && isOnline) {
        try {
          await SupabaseSync.uploadSingle('compra', compraData);
        } catch (e) {
          console.error('Error al sincronizar:', e);
        }
      }

      cancelarEdicion();
      renderizarCompras();
    });

    async function abrirModalCategorias() {
      renderizarListaCategorias();
      document.getElementById('modalCategorias').classList.add('active');
      setTimeout(() => document.getElementById('nuevaCategoriaInput')?.focus(), 300);
    }

    function cerrarModal(id) {
      document.getElementById(id)?.classList.remove('active');
    }

    function renderizarListaCategorias() {
      const lista = document.getElementById('listaCategoriasAdmin');
      if (!lista) return;

      lista.innerHTML = '';

      if (categorias.length === 0) {
        lista.innerHTML = '<p class="no-compras">No hay categorías</p>';
        return;
      }

      categorias.forEach((cat, index) => {
        const div = document.createElement('div');
        div.className = 'categoria-item';
        div.id = 'cat-' + index;

        const spanNombre = document.createElement('span');
        spanNombre.className = 'categoria-nombre';
        spanNombre.textContent = cat;
        div.appendChild(spanNombre);

        const inputEdit = document.createElement('input');
        inputEdit.type = 'text';
        inputEdit.className = 'categoria-edit-input';
        inputEdit.value = cat;
        div.appendChild(inputEdit);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        const btnEdit = document.createElement('button');
        btnEdit.className = 'btn btn-secondary btn-mini';
        btnEdit.textContent = '✏️';
        btnEdit.onclick = () => activarEdicionCategoria(index);
        btnGroup.appendChild(btnEdit);

        const btnSave = document.createElement('button');
        btnSave.className = 'btn btn-primary btn-mini';
        btnSave.textContent = '💾';
        btnSave.style.display = 'none';
        btnSave.onclick = () => guardarEdicionCategoria(index);
        btnGroup.appendChild(btnSave);

        const btnCancel = document.createElement('button');
        btnCancel.className = 'btn btn-secondary btn-mini';
        btnCancel.textContent = '✖';
        btnCancel.style.display = 'none';
        btnCancel.onclick = () => cancelarEdicionCategoria(index);
        btnGroup.appendChild(btnCancel);

        const btnDelete = document.createElement('button');
        btnDelete.className = 'btn btn-danger btn-mini';
        btnDelete.textContent = '🗑️';
        btnDelete.onclick = () => eliminarCategoria(index);
        btnGroup.appendChild(btnDelete);

        div.appendChild(btnGroup);
        lista.appendChild(div);
      });
    }

    function activarEdicionCategoria(index) {
      const item = document.getElementById('cat-' + index);
      if (!item) return;

      const spanNombre = item.querySelector('.categoria-nombre');
      const inputEdit = item.querySelector('.categoria-edit-input');
      const btns = item.querySelectorAll('.btn');

      spanNombre.style.display = 'none';
      inputEdit.classList.add('active');
      inputEdit.focus();

      btns[0].style.display = 'none';
      btns[3].style.display = 'none';
      btns[1].style.display = 'inline-block';
      btns[2].style.display = 'inline-block';
    }

    function cancelarEdicionCategoria(index) {
      const item = document.getElementById('cat-' + index);
      if (!item) return;

      const spanNombre = item.querySelector('.categoria-nombre');
      const inputEdit = item.querySelector('.categoria-edit-input');
      const btns = item.querySelectorAll('.btn');

      spanNombre.style.display = 'inline';
      inputEdit.classList.remove('active');

      btns[0].style.display = 'inline-block';
      btns[3].style.display = 'inline-block';
      btns[1].style.display = 'none';
      btns[2].style.display = 'none';
    }

    function guardarEdicionCategoria(index) {
      const item = document.getElementById('cat-' + index);
      if (!item) return;

      const inputEdit = item.querySelector('.categoria-edit-input');
      const nuevoNombre = inputEdit.value.trim();

      if (!nuevoNombre) {
        alert('Nombre vacío');
        return;
      }

      categorias[index] = nuevoNombre;
      localStorage.setItem('categorias_compras', JSON.stringify(categorias));

      renderizarOpcionesCategorias();
      renderizarFiltrosCategorias();
      renderizarListaCategorias();
    }

    function agregarCategoria() {
      const input = document.getElementById('nuevaCategoriaInput');
      if (!input) return;

      const nombre = input.value.trim();
      if (!nombre) {
        alert('Ingresa un nombre');
        return;
      }

      if (categorias.includes(nombre)) {
        alert('Ya existe');
        input.value = '';
        return;
      }

      categorias.push(nombre);
      categorias.sort();
      localStorage.setItem('categorias_compras', JSON.stringify(categorias));

      input.value = '';
      renderizarOpcionesCategorias();
      renderizarFiltrosCategorias();
      renderizarListaCategorias();
    }

    function eliminarCategoria(index) {
      const nombre = categorias[index];
      if (!confirm(`¿Eliminar "${nombre}"?`)) return;

      categorias.splice(index, 1);
      localStorage.setItem('categorias_compras', JSON.stringify(categorias));

      renderizarOpcionesCategorias();
      renderizarFiltrosCategorias();
      renderizarListaCategorias();
    }

    function aplicarFiltros() {
      renderizarCompras();
    }

    window.addEventListener('click', function (e) {
      if (e.target.classList.contains('modal')) {
        e.target.classList.remove('active');
      }
    });

    // Toggle menú móvil
    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');

    if (menuToggle && mobileMenu) {
      menuToggle.addEventListener('click', () => {
        mobileMenu.classList.toggle('active');
      });
    }
  </script>

</body>

</html>
